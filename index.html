<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nexora AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #f7f8fc;
            --surface: #ffffff;
            --text: #171923;
            --muted: #737783;
            --border: #e3e5ec;
            --primary: #171923;
            --hover: #f0f1f5;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 70px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 13px;
            background: var(--primary);
            color: white;
            font-size: 22px;
        }

        .brand-text h1 {
            font-size: 19px;
            font-weight: 700;
        }

        .brand-text span {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
        }

        .new-chat {
            padding: 9px 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: white;
            color: var(--text);
            cursor: pointer;
            transition: .2s;
        }

        .new-chat:hover {
            background: var(--hover);
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px;
        }

        .welcome {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .welcome-logo {
            width: 66px;
            height: 66px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: var(--primary);
            color: white;
            font-size: 30px;
            margin-bottom: 20px;
        }

        .welcome h2 {
            font-size: 31px;
            margin-bottom: 10px;
        }

        .welcome p {
            max-width: 560px;
            color: var(--muted);
            line-height: 1.6;
            font-size: 15px;
        }

        .suggestions {
            width: 100%;
            max-width: 650px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 30px;
        }

        .suggestions button {
            min-height: 58px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 13px;
            cursor: pointer;
            text-align: left;
            color: var(--text);
            transition: .2s;
        }

        .suggestions button:hover {
            background: var(--hover);
            border-color: #cfd2dc;
            transform: translateY(-1px);
        }

        .message {
            width: 100%;
            max-width: 850px;
            margin: 0 auto 25px;
            display: flex;
            gap: 12px;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 11px;
            background: var(--primary);
            color: white;
            font-size: 15px;
        }

        .message.user .message-avatar {
            background: #e7e8ee;
            color: #333;
        }

        .message-content {
            padding-top: 6px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .input-section {
            padding: 12px 20px 18px;
            background: var(--background);
        }

        .input-box {
            width: 100%;
            max-width: 850px;
            margin: auto;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 8px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,.04);
        }

        textarea {
            flex: 1;
            min-height: 42px;
            max-height: 150px;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            padding: 11px 4px;
            font-size: 15px;
            line-height: 20px;
            color: var(--text);
        }

        textarea::placeholder {
            color: #999da7;
        }

        .attach-button {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            color: #70737d;
            border-radius: 11px;
            font-size: 23px;
            cursor: pointer;
        }

        .attach-button:hover {
            background: var(--hover);
        }

        .send-button {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            font-size: 22px;
            cursor: pointer;
            transition: .2s;
        }

        .send-button:hover {
            transform: translateY(-1px);
            background: #000;
        }

        .send-button:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .input-footer {
            text-align: center;
            margin-top: 8px;
            color: #999da7;
            font-size: 11px;
        }

        .thinking-dots {
            display: flex;
            gap: 4px;
            padding-top: 10px;
        }

        .thinking-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #777;
            animation: bounce 1.2s infinite;
        }

        .thinking-dots span:nth-child(2) {
            animation-delay: .15s;
        }

        .thinking-dots span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-5px);
            }
        }

        .chat-area::-webkit-scrollbar {
            width: 7px;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: #d5d7df;
            border-radius: 10px;
        }

        @media (max-width: 650px) {

            .header {
                height: 62px;
                padding: 0 13px;
            }

            .logo {
                width: 38px;
                height: 38px;
                border-radius: 11px;
            }

            .brand-text h1 {
                font-size: 16px;
            }

            .brand-text span {
                font-size: 10px;
            }

            .new-chat {
                padding: 8px 10px;
                font-size: 12px;
            }

            .chat-area {
                padding: 20px 12px;
            }

            .welcome-logo {
                width: 55px;
                height: 55px;
                border-radius: 17px;
                font-size: 25px;
            }

            .welcome h2 {
                font-size: 25px;
            }

            .welcome p {
                font-size: 14px;
            }

            .suggestions {
                grid-template-columns: 1fr;
                margin-top: 24px;
            }

            .input-section {
                padding: 8px 10px 12px;
            }
        }

        @media (max-width: 400px) {

            .welcome h2 {
                font-size: 22px;
            }

            .welcome p {
                font-size: 13px;
            }
        }

    </style>

</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="logo">
                ✦
            </div>

            <div class="brand-text">

                <h1>Nexora AI</h1>

                <span>AI Assistant</span>

            </div>

        </div>

        <button
            class="new-chat"
            id="newChat"
        >
            ＋ New Chat
        </button>

    </header>


    <main
        class="chat-area"
        id="chatArea"
    >

        <section
            class="welcome"
            id="welcome"
        >

            <div class="welcome-logo">
                ✦
            </div>

            <h2>
                How can I help you?
            </h2>

            <p>
                Ask Nexora anything, solve problems,
                write, code, or explore ideas.
            </p>

            <div class="suggestions">

                <button data-prompt="Explain artificial intelligence simply">
                    🧠
                    <span>Explain AI</span>
                </button>

                <button data-prompt="Give me a creative story idea">
                    ✍️
                    <span>Creative Writing</span>
                </button>

                <button data-prompt="Help me write a JavaScript program">
                    💻
                    <span>Coding Help</span>
                </button>

                <button data-prompt="Solve 25 × 48 step by step">
                    🔢
                    <span>Solve Math</span>
                </button>

            </div>

        </section>

    </main>


    <div class="input-section">

        <div class="input-box">

            <button
                class="attach-button"
                id="attachButton"
                title="Attach file"
            >
                ＋
            </button>

            <textarea
                id="messageInput"
                placeholder="Message Nexora..."
                rows="1"
            ></textarea>

            <button
                class="send-button"
                id="sendButton"
                title="Send"
            >
                ↑
            </button>

        </div>

        <div class="input-footer">
            Nexora can make mistakes. Check important information.
        </div>

    </div>

</div>


<script>

/* =========================================================
   GEMINI API KEY
   ========================================================= */

const GEMINI_API_KEY = AQ.Ab8RN6LNbE4831uhHNUtsdmFGkBaNWwyKIpoQjADzrj4BUgZWQ


/* =========================================================
   ELEMENTS
   ========================================================= */

const chatArea =
    document.getElementById("chatArea");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const newChatButton =
    document.getElementById("newChat");

const welcome =
    document.getElementById("welcome");


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================================================
   ADD MESSAGE
   ========================================================= */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        `message ${type}`;

    message.innerHTML = `

        <div class="message-avatar">
            ${type === "user" ? "👤" : "✦"}
        </div>

        <div class="message-content">
            ${escapeHTML(text)}
        </div>

    `;

    chatArea.appendChild(message);

    chatArea.scrollTop =
        chatArea.scrollHeight;
}


async function typeMessage(text) {

    const message =
        document.createElement("div");

    message.className =
        "message assistant";

    message.innerHTML = `
        <div class="message-avatar">
            ✦
        </div>

        <div class="message-content"></div>
    `;

    chatArea.appendChild(message);

    const content =
        message.querySelector(".message-content");

    for (let i = 0; i < text.length; i++) {

        content.textContent += text[i];

        chatArea.scrollTop =
            chatArea.scrollHeight;

        await new Promise(resolve =>
            setTimeout(resolve, 12)
        );

    }
}


    
/* =========================================================
   THINKING
   ========================================================= */

function showThinking() {

    const thinking =
        document.createElement("div");

    thinking.id =
        "thinking";

    thinking.className =
        "message assistant";

    thinking.innerHTML = `

        <div class="message-avatar">
            ✦
        </div>

        <div class="message-content">

            <div class="thinking-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    `;

    chatArea.appendChild(thinking);

    chatArea.scrollTop =
        chatArea.scrollHeight;
}


function removeThinking() {

    const thinking =
        document.getElementById("thinking");

    if (thinking) {
        thinking.remove();
    }
}


/* =========================================================
   GEMINI
   ========================================================= */

let conversationHistory = [];
    
async function askNexora(message) {

    conversationHistory.push({
        role: "user",
        parts: [
            {
                text: message
            }
        ]
    });

    const url =
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="
        + encodeURIComponent(GEMINI_API_KEY);

    const response = await fetch(url, {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            systemInstruction: {
                parts: [
                    {
                        text: "You are Nexora AI, a helpful, friendly and intelligent AI assistant. Remember the conversation context and use previous messages when answering."
                    }
                ]
            },

            contents: conversationHistory

        })

    });

    const data = await response.json();

    if (!response.ok) {

        console.error(data);

        throw new Error(
            data?.error?.message ||
            "Gemini API request failed."
        );

    }

    const reply =
        data?.candidates?.[0]?.content?.parts
            ?.map(part => part.text || "")
            .join("")
            .trim();

    if (!reply) {
        throw new Error("Nexora did not receive a response.");
    }

    conversationHistory.push({
        role: "model",
        parts: [
            {
                text: reply
            }
        ]
    });

    return reply;
}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text) return;


    if (
        GEMINI_API_KEY ===
        "PASTE_YOUR_GEMINI_API_KEY_HERE"
    ) {

        alert(
            "আগে code-এর GEMINI_API_KEY জায়গায় তোমার API key বসাও।"
        );

        return;
    }


    welcome.style.display =
        "none";

    addMessage(
        text,
        "user"
    );

    messageInput.value = "";

    sendButton.disabled = true;

    showThinking();


    try {

        const response =
            await askNexora(text);

        removeThinking();

       await typeMessage(response);

    } catch (error) {

        removeThinking();

        addMessage(
            "দুঃখিত, Nexora এখন response দিতে পারছে না.\n\nError: "
            + error.message,
            "assistant"
        );

    }


    sendButton.disabled =
        false;

    messageInput.focus();
}


/* =========================================================
   SEND BUTTON
   ========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER
   ========================================================= */

messageInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);


/* =========================================================
   SUGGESTIONS
   ========================================================= */

document
    .querySelectorAll(".suggestions button")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                messageInput.value =
                    button.dataset.prompt;

                messageInput.focus();

            }
        );

    });


/* =========================================================
   NEW CHAT
   ========================================================= */

newChatButton.addEventListener("click", () => {

    chatArea.innerHTML = "";

    chatArea.appendChild(welcome);

    welcome.style.display = "flex";

    messageInput.value = "";

    conversationHistory = [];

    sendButton.disabled = false;

    messageInput.focus();

});
    

</script>

</body>

</html>
